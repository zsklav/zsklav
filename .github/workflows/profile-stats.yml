name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main, master]
    paths:
      - '.github/scripts/update-stats.mjs'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Generate public GitHub stats
        run: node .github/scripts/update-stats.mjs
        env:
          PROFILE_USER: zsklav
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/github.svg assets/stats/languages.svg assets/stats/data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update profile stats'
          git push
